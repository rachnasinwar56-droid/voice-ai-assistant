name: Build Siri APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - name: Generate Android Project
        run: flutter create --platforms=android --project-name=voice_ai_assistant .

      - name: Flutter Clean & Pub Get
        run: |
          flutter clean
          flutter pub get

      - name: Manual Gradle Fixes (Safe Mode)
        run: |
          # 1. App Level Fix (minSdk 24, compileSdk 34)
          sed -i -E 's/minSdkVersion[[:space:]]+flutter\.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle
          sed -i -E 's/minSdkVersion[[:space:]]+[0-9]+/minSdkVersion 24/g' android/app/build.gradle
          sed -i -E 's/compileSdkVersion[[:space:]]+flutter\.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle
          sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 34/g' android/app/build.gradle

          # 2. Plugin Level Fix (Kotlin 17, Java 17 & compileSdk 34) - Manual Line by Line
          echo 'subprojects {' >> android/build.gradle
          echo '    tasks.matching { it.class.name.contains("KotlinCompile") }.configureEach { kotlinOptions { jvmTarget = "17" } }' >> android/build.gradle
          echo '    plugins.withId("com.android.library") {' >> android/build.gradle
          echo '        android {' >> android/build.gradle
          echo '            compileSdkVersion 34' >> android/build.gradle
          echo '            compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }' >> android/build.gradle
          echo '        }' >> android/build.gradle
          echo '    }' >> android/build.gradle
          echo '}' >> android/build.gradle

      - name: Build Release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: flutter build apk --release --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Siri-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
