name: Build Siri APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------
      # JAVA 17
      # ----------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ----------------------------------------
      # FLUTTER
      # ----------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - name: Show versions
        run: |
          java -version
          flutter --version
          dart --version

      # ----------------------------------------
      # CREATE ANDROID PROJECT
      # ----------------------------------------
      - name: Generate Android Project
        run: |
          flutter create --platforms=android .

      # ----------------------------------------
      # FORCE MIN SDK 24
      # ----------------------------------------
      - name: Set Android minSdk 24
        shell: bash
        run: |
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*flutter\.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts
            sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*[0-9]+/minSdk = 24/g' android/app/build.gradle.kts
            sed -i -E 's/minSdkVersion[[:space:]]+flutter\.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle.kts
            sed -i -E 's/minSdkVersion[[:space:]]+[0-9]+/minSdkVersion 24/g' android/app/build.gradle.kts
          fi

          if [ -f "android/app/build.gradle" ]; then
            sed -i -E 's/minSdkVersion[[:space:]]+flutter\.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle
            sed -i -E 's/minSdkVersion[[:space:]]+[0-9]+/minSdkVersion 24/g' android/app/build.gradle
            sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*flutter\.minSdkVersion/minSdk = 24/g' android/app/build.gradle
            sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*[0-9]+/minSdk = 24/g' android/app/build.gradle
          fi

          echo "Android minSdk:"
          grep -R "minSdk" android/app || true

      # ----------------------------------------
      # CHECK FOR BROKEN JAVA VERSION
      # ----------------------------------------
      - name: Fix invalid JavaVersion values
        shell: bash
        run: |
          find android -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -print0 | while IFS= read -r -d '' file
          do
            sed -i 's/VERSION_17_8/VERSION_17/g' "$file"
            sed -i 's/JavaVersion.VERSION_17_8/JavaVersion.VERSION_17/g' "$file"
          done

      # ----------------------------------------
      # FLUTTER PACKAGES
      # ----------------------------------------
      - name: Flutter Clean
        run: flutter clean

      - name: Get Packages
        run: flutter pub get

      # ----------------------------------------
      # ANALYZE
      # ----------------------------------------
      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      # ----------------------------------------
      # BUILD APK
      # ----------------------------------------
      - name: Build Release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"

      # ----------------------------------------
      # UPLOAD APK
      # ----------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Siri-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
