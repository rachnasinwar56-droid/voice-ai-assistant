name: Build Siri APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ======================================================
      # FLUTTER
      # ======================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: stable
          cache: true


      - name: Flutter Version
        run: flutter --version


      # ======================================================
      # GENERATE ANDROID PROJECT
      # ======================================================

      - name: Generate Android Project
        run: flutter create --platforms=android .


      # ======================================================
      # MIN SDK 24
      # ======================================================

      - name: Force Android minSdk 24
        shell: bash
        run: |

          echo "Checking Android build files..."

          if [ -f "android/app/build.gradle.kts" ]; then

            sed -i -E \
              's/minSdk[[:space:]]*=[[:space:]]*flutter\.minSdkVersion/minSdk = 24/g' \
              android/app/build.gradle.kts

            sed -i -E \
              's/minSdk[[:space:]]*=[[:space:]]*[0-9]+/minSdk = 24/g' \
              android/app/build.gradle.kts

          fi


          if [ -f "android/app/build.gradle" ]; then

            sed -i -E \
              's/minSdkVersion[[:space:]]+flutter\.minSdkVersion/minSdkVersion 24/g' \
              android/app/build.gradle

            sed -i -E \
              's/minSdkVersion[[:space:]]+[0-9]+/minSdkVersion 24/g' \
              android/app/build.gradle

          fi


          echo "Final minSdk configuration:"

          grep -R "minSdk" android/app || true


      # ======================================================
      # PACKAGES
      # ======================================================

      - name: Flutter Pub Get
        run: flutter pub get


      # ======================================================
      # ANALYZE
      # ======================================================

      - name: Flutter Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true


      # ======================================================
      # BUILD RELEASE APK
      # ======================================================

      - name: Build Release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |

          flutter build apk \
            --release \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"


      # ======================================================
      # UPLOAD APK
      # ======================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Siri-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
