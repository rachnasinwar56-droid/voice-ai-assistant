name: Build Siri APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: stable
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Generate Android Project
        run: flutter create --platforms=android .

      - name: Fix Kotlin Version
        shell: bash
        run: |
          if [ -f "android/settings.gradle.kts" ]; then
            sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*" apply false/id("org.jetbrains.kotlin.android") version "2.2.20" apply false/' android/settings.gradle.kts
          fi

          if [ -f "android/settings.gradle" ]; then
            sed -i "s/id 'org.jetbrains.kotlin.android' version '[^']*' apply false/id 'org.jetbrains.kotlin.android' version '2.2.20' apply false/" android/settings.gradle
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*" apply false/id "org.jetbrains.kotlin.android" version "2.2.20" apply false/' android/settings.gradle
          fi

      - name: Fix minSdk
        shell: bash
        run: |
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts
            sed -i 's/minSdk = [0-9]*/minSdk = 24/g' android/app/build.gradle.kts
          fi

          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle
            sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/g' android/app/build.gradle
          fi

      - name: Get Packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Siri-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
