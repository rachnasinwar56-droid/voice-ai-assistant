name: voice_ai_assistant
description: Voice-first Gemini Live AI Assistant
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # WebSocket
  web_socket_channel: ^3.0.3

  # Microphone / permissions
  permission_handler: ^12.0.1

  # Audio recording
  record: ^6.0.0

  # Play PCM/WAV response audio
  just_audio: ^0.10.0

  # Open Android settings
  android_intent_plus: ^5.3.0

  # State/helper
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
