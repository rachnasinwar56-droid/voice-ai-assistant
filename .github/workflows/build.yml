name: Build Siri APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: stable
          cache: true

      - name: Flutter Version
        run: flutter --version

      # 3. Generate Android files
      - name: Generate Android Project
        run: flutter create --platforms=android .

      # 4. Fix minSdk for flutter_tts
      - name: Fix Android minSdk
        shell: bash
        run: |
          echo "===== Fixing minSdk to 24 ====="

          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts
            sed -i 's/minSdk = [0-9][0-9]*/minSdk = 24/g' android/app/build.gradle.kts

          elif [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle
            sed -i 's/minSdkVersion [0-9][0-9]*/minSdkVersion 24/g' android/app/build.gradle
          fi

          echo "===== Current minSdk ====="
          grep -R "minSdk" android/app/build.gradle* || true

      # 5. Get Flutter packages
      - name: Get Packages
        run: flutter pub get

      # 6. Remove default Flutter test
      # This fixes:
      # The name 'MyApp' isn't a class
      - name: Remove Default Flutter Test
        run: |
          rm -rf test
          echo "Default test folder removed."

      # 7. Analyze
      # Warnings/info will NOT stop the build
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # 8. Build APK
      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Siri-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
