name: Build Siri APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================================
      # FLUTTER
      # ========================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: stable
          cache: true


      - name: Flutter Version
        run: flutter --version


      # ========================================================
      # CREATE ANDROID PROJECT IF REQUIRED
      # ========================================================

      - name: Generate Android Project
        run: flutter create --platforms=android .


      # ========================================================
      # FIX KOTLIN
      #
      # flutter_tts documentation recommends Kotlin 1.9.10
      # ========================================================

      - name: Fix Kotlin Version
        shell: bash
        run: |
          set -e

          echo "Searching Kotlin configuration..."

          if [ -f "android/settings.gradle.kts" ]; then
            echo "Found settings.gradle.kts"

            sed -i -E \
              's/(id\("org\.jetbrains\.kotlin\.android"\)[[:space:]]+version[[:space:]]+")([^"]+)(" apply false)/\11.9.10\3/g' \
              android/settings.gradle.kts

            echo "Kotlin configuration:"
            grep -n "kotlin.android" android/settings.gradle.kts || true
          fi

          if [ -f "android/settings.gradle" ]; then
            echo "Found settings.gradle"

            sed -i -E \
              "s/(id[[:space:]]+['\"]org\.jetbrains\.kotlin\.android['\"][[:space:]]+version[[:space:]]+['\"])[^'\"]+(['\"][[:space:]]+apply false)/\11.9.10\2/g" \
              android/settings.gradle

            echo "Kotlin configuration:"
            grep -n "kotlin.android" android/settings.gradle || true
          fi

          if [ -f "android/build.gradle" ]; then
            sed -i -E \
              "s/(kotlin_version[[:space:]]*=[[:space:]]*['\"])[^'\"]+(['\"])/\11.9.10\2/g" \
              android/build.gradle || true

            grep -n "kotlin_version" android/build.gradle || true
          fi


      # ========================================================
      # FIX ANDROID MIN SDK + JAVA/KOTLIN JVM
      # ========================================================

      - name: Fix Android Build Settings
        shell: bash
        run: |
          set -e

          echo "Fixing Android build settings..."

          if [ -f "android/app/build.gradle.kts" ]; then

            sed -i -E \
              's/minSdk[[:space:]]*=[[:space:]]*flutter\.minSdkVersion/minSdk = 24/g' \
              android/app/build.gradle.kts || true

            sed -i -E \
              's/minSdk[[:space:]]*=[[:space:]]*[0-9]+/minSdk = 24/g' \
              android/app/build.gradle.kts || true

            sed -i -E \
              's/JavaVersion\.VERSION_[0-9]+/JavaVersion.VERSION_17/g' \
              android/app/build.gradle.kts || true

            echo "----- app/build.gradle.kts -----"
            cat android/app/build.gradle.kts
          fi


          if [ -f "android/app/build.gradle" ]; then

            sed -i -E \
              's/minSdkVersion[[:space:]]+flutter\.minSdkVersion/minSdkVersion 24/g' \
              android/app/build.gradle || true

            sed -i -E \
              's/minSdkVersion[[:space:]]+[0-9]+/minSdkVersion 24/g' \
              android/app/build.gradle || true

            sed -i -E \
              's/minSdk[[:space:]]*=[[:space:]]*flutter\.minSdkVersion/minSdk = 24/g' \
              android/app/build.gradle || true

            sed -i -E \
              's/minSdk[[:space:]]*=[[:space:]]*[0-9]+/minSdk = 24/g' \
              android/app/build.gradle || true

            sed -i -E \
              's/JavaVersion\.VERSION_[0-9]+/JavaVersion.VERSION_17/g' \
              android/app/build.gradle || true

            echo "----- app/build.gradle -----"
            cat android/app/build.gradle
          fi


      # ========================================================
      # FORCE JAVA 17
      # ========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ========================================================
      # GET PACKAGES
      # ========================================================

      - name: Get Packages
        run: flutter pub get


      # ========================================================
      # ANALYZE
      # ========================================================

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true


      # ========================================================
      # BUILD APK
      # ========================================================

      - name: Build Release APK
        run: |
          flutter build apk --release \
            --dart-define=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"


      # ========================================================
      # UPLOAD APK
      # ========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Siri-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
