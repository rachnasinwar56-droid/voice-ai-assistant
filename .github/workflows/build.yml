name: Build Siri APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ========================================================
      # JAVA 17
      # ========================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle


      # ========================================================
      # FLUTTER
      # ========================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: stable
          cache: true


      # ========================================================
      # SHOW VERSIONS
      # ========================================================

      - name: Show versions
        run: |
          java -version
          flutter --version
          dart --version


      # ========================================================
      # GENERATE ANDROID PROJECT
      # ========================================================

      - name: Generate Android Project
        run: |
          flutter create --platforms=android .


      # ========================================================
      # FIX ANDROID BUILD FILE
      # ========================================================

      - name: Configure Android Java 17 and minSdk 24
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")

          if path.exists():
              text = path.read_text()

              text = text.replace(
                  "JavaVersion.VERSION_17_8",
                  "JavaVersion.VERSION_17"
              )

              text = text.replace(
                  "JavaVersion.VERSION_17_8",
                  "JavaVersion.VERSION_17"
              )

              text = text.replace(
                  "minSdkVersion flutter.minSdkVersion",
                  "minSdkVersion 24"
              )

              text = text.replace(
                  "minSdk = flutter.minSdkVersion",
                  "minSdk = 24"
              )

              path.write_text(text)

          # Kotlin DSL, if Flutter generated it.
          kts = Path("android/app/build.gradle.kts")

          if kts.exists():
              text = kts.read_text()

              text = text.replace(
                  "JavaVersion.VERSION_17_8",
                  "JavaVersion.VERSION_17"
              )

              text = text.replace(
                  "minSdk = flutter.minSdkVersion",
                  "minSdk = 24"
              )

              kts.write_text(text)

          print("Android configuration fixed.")
          PY


      # ========================================================
      # VERIFY JAVA CONFIG
      # ========================================================

      - name: Verify Android configuration
        run: |
          echo "Checking JavaVersion..."
          grep -R "VERSION_17" android || true

          echo "Checking minSdk..."
          grep -R "minSdk" android/app || true

          echo "Checking invalid VERSION_17_8..."
          if grep -R "VERSION_17_8" android; then
            echo "ERROR: VERSION_17_8 still exists."
            exit 1
          fi


      # ========================================================
      # GET PACKAGES
      # ========================================================

      - name: Get Packages
        run: flutter pub get


      # ========================================================
      # ANALYZE
      # ========================================================

      - name: Analyze
        run: flutter analyze
        continue-on-error: true


      # ========================================================
      # BUILD APK
      # ========================================================

      - name: Build Release APK
        run: |
          flutter build apk --release \
            --dart-define=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"


      # ========================================================
      # UPLOAD APK
      # ========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Siri-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
