name: Build Siri APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # FLUTTER
      # ==========================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: stable
          cache: true

      - name: Flutter Version
        run: flutter --version

      # ==========================================
      # GENERATE ANDROID PROJECT
      # ==========================================
      - name: Generate Android Project
        run: flutter create --platforms=android .

      # ==========================================
      # JAVA 17
      # IMPORTANT:
      # This comes AFTER flutter create.
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Show Java Version
        run: java -version

      # ==========================================
      # FIX ANDROID CONFIG
      # ==========================================
      - name: Fix Android Configuration
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Android files"
          echo "=========================================="

          ls -la android
          ls -la android/app

          # --------------------------------------
          # Kotlin 1.9.10
          # flutter_tts recommends Kotlin 1.9.10
          # --------------------------------------

          if [ -f "android/settings.gradle" ]; then
            sed -i -E \
              's/(id ["'\'']org\.jetbrains\.kotlin\.android["'\''] version ["'\''])[^"'\'']+(["'\''] apply false)/\11.9.10\2/g' \
              android/settings.gradle
          fi

          if [ -f "android/settings.gradle.kts" ]; then
            sed -i -E \
              's/(id\("org\.jetbrains\.kotlin\.android"\) version ")[^"]+(" apply false)/\11.9.10\2/g' \
              android/settings.gradle.kts
          fi

          # --------------------------------------
          # minSdk 24
          # --------------------------------------

          if [ -f "android/app/build.gradle" ]; then

            sed -i -E \
              's/minSdkVersion[[:space:]]+flutter\.minSdkVersion/minSdkVersion 24/g' \
              android/app/build.gradle || true

            sed -i -E \
              's/minSdkVersion[[:space:]]+[0-9]+/minSdkVersion 24/g' \
              android/app/build.gradle || true

            sed -i -E \
              's/minSdk[[:space:]]*=[[:space:]]*flutter\.minSdkVersion/minSdk = 24/g' \
              android/app/build.gradle || true

            sed -i -E \
              's/minSdk[[:space:]]*=[[:space:]]*[0-9]+/minSdk = 24/g' \
              android/app/build.gradle || true

            # ----------------------------------
            # Java 17
            # ----------------------------------

            sed -i -E \
              's/JavaVersion\.VERSION_[0-9_]+/JavaVersion.VERSION_17/g' \
              android/app/build.gradle || true

            sed -i -E \
              's/jvmTarget[[:space:]]*=[[:space:]]*["'\''][^"'\'']+["'\'']/jvmTarget = JavaVersion.VERSION_17.toString()/g' \
              android/app/build.gradle || true
          fi

          if [ -f "android/app/build.gradle.kts" ]; then

            sed -i -E \
              's/minSdk[[:space:]]*=[[:space:]]*flutter\.minSdkVersion/minSdk = 24/g' \
              android/app/build.gradle.kts || true

            sed -i -E \
              's/minSdk[[:space:]]*=[[:space:]]*[0-9]+/minSdk = 24/g' \
              android/app/build.gradle.kts || true

            sed -i -E \
              's/JavaVersion\.VERSION_[0-9_]+/JavaVersion.VERSION_17/g' \
              android/app/build.gradle.kts || true
          fi

          # --------------------------------------
          # Print final configuration
          # --------------------------------------

          echo ""
          echo "=========================================="
          echo "Kotlin configuration"
          echo "=========================================="

          grep -R "kotlin.android" android/settings.gradle* || true

          echo ""
          echo "=========================================="
          echo "minSdk configuration"
          echo "=========================================="

          grep -R "minSdk" android/app || true

          echo ""
          echo "=========================================="
          echo "Java configuration"
          echo "=========================================="

          grep -R "VERSION_17\|jvmTarget" android/app || true

      # ==========================================
      # GET PACKAGES
      # ==========================================
      - name: Get Packages
        run: flutter pub get

      # ==========================================
      # ANALYZE
      # ==========================================
      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      # ==========================================
      # BUILD APK
      # ==========================================
      - name: Build Release APK
        run: |
          flutter clean
          flutter pub get

          flutter build apk --release \
            --dart-define=GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"

      # ==========================================
      # UPLOAD APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Siri-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
