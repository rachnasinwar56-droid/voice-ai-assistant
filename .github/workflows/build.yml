name: Build Siri APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - name: Generate Android Project
        run: flutter create --platforms=android --project-name=voice_ai_assistant .

      - name: Flutter Clean & Pub Get
        run: |
          flutter clean
          flutter pub get

      # यह नया स्टेप Kotlin Gradle Plugin को नए वर्ज़न 1.9.24 पर अपडेट कर देगा
      - name: Upgrade Kotlin Gradle Plugin
        run: |
          if [ -f "android/settings.gradle" ]; then
            sed -i -E 's/id "org.jetbrains.kotlin.android" version ".*"/id "org.jetbrains.kotlin.android" version "1.9.24"/g' android/settings.gradle
          fi
          if [ -f "android/build.gradle" ]; then
            sed -i -E "s/ext.kotlin_version = '.*'/ext.kotlin_version = '1.9.24'/g" android/build.gradle
          fi

      - name: App Level Build.gradle Fix
        run: |
          sed -i -E 's/minSdkVersion[[:space:]]+flutter\.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle
          sed -i -E 's/minSdkVersion[[:space:]]+[0-9]+/minSdkVersion 24/g' android/app/build.gradle
          sed -i -E 's/compileSdkVersion[[:space:]]+flutter\.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle
          sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 34/g' android/app/build.gradle

      - name: Master Override - Patch Plugins in Pub Cache
        run: |
          PUB_CACHE="$HOME/.pub-cache"
          if [ -d "$PUB_CACHE" ]; then
            find "$PUB_CACHE" -type f -name "build.gradle" -exec sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' {} +
            find "$PUB_CACHE" -type f -name "build.gradle" -exec sed -i 's/JavaVersion.VERSION_11/JavaVersion.VERSION_17/g' {} +
            find "$PUB_CACHE" -type f -name "build.gradle" -exec sed -i "s/jvmTarget = '1.8'/jvmTarget = '17'/g" {} +
            find "$PUB_CACHE" -type f -name "build.gradle" -exec sed -i "s/jvmTarget = '11'/jvmTarget = '17'/g" {} +
            find "$PUB_CACHE" -type f -name "build.gradle" -exec sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' {} +
            find "$PUB_CACHE" -type f -name "build.gradle" -exec sed -i 's/jvmTarget = "11"/jvmTarget = "17"/g' {} +
          fi

      - name: Master Override - Root Gradle Config
        run: |
          echo "allprojects {" >> android/build.gradle
          echo "    tasks.withType(JavaCompile).configureEach {" >> android/build.gradle
          echo "        sourceCompatibility = \"17\"" >> android/build.gradle
          echo "        targetCompatibility = \"17\"" >> android/build.gradle
          echo "    }" >> android/build.gradle
          echo "    tasks.matching { it.class.name.contains(\"KotlinCompile\") }.configureEach {" >> android/build.gradle
          echo "        kotlinOptions {" >> android/build.gradle
          echo "            jvmTarget = \"17\"" >> android/build.gradle
          echo "        }" >> android/build.gradle
          echo "    }" >> android/build.gradle
          echo "}" >> android/build.gradle

      - name: Build Release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: flutter build apk --release --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Siri-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
