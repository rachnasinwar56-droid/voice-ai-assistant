name: Build Siri APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------
      # JAVA 17
      # ----------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ----------------------------------------
      # FLUTTER
      # ----------------------------------------
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0'
          channel: stable
          cache: true

      - name: Show versions
        run: |
          java -version
          flutter --version
          dart --version

      # ----------------------------------------
      # SETUP GLOBAL GRADLE KOTLIN FIX
      # ----------------------------------------
      - name: Setup Global Gradle Fixes
        shell: bash
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/init.gradle
          allprojects {
              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions {
                      jvmTarget = "17"
                  }
              }
          }
          EOF

      # ----------------------------------------
      # CREATE ANDROID PROJECT
      # ----------------------------------------
      - name: Generate Android Project
        run: |
          flutter create --platforms=android --project-name=voice_ai_assistant .

      # ----------------------------------------
      # FLUTTER PACKAGES
      # ----------------------------------------
      - name: Flutter Clean
        run: flutter clean

      - name: Get Packages
        run: flutter pub get

      # ----------------------------------------
      # FIX SDK VERSIONS IN APP & PLUGINS
      # ----------------------------------------
      - name: Fix SDK Versions for App and Pub Cache Plugins
        shell: bash
        run: |
          # Fix app build.gradle
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*flutter\.minSdkVersion/minSdk = 24/g' android/app/build.gradle.kts
            sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*[0-9]+/minSdk = 24/g' android/app/build.gradle.kts
            sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*flutter\.compileSdkVersion/compileSdk = 34/g' android/app/build.gradle.kts
            sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 34/g' android/app/build.gradle.kts
          fi

          if [ -f "android/app/build.gradle" ]; then
            sed -i -E 's/minSdkVersion[[:space:]]+flutter\.minSdkVersion/minSdkVersion 24/g' android/app/build.gradle
            sed -i -E 's/minSdkVersion[[:space:]]+[0-9]+/minSdkVersion 24/g' android/app/build.gradle
            sed -i -E 's/compileSdkVersion[[:space:]]+flutter\.compileSdkVersion/compileSdkVersion 34/g' android/app/build.gradle
            sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 34/g' android/app/build.gradle
          fi

          # Fix all plugins in pub cache directly
          if [ -d "$HOME/.pub-cache" ]; then
            find "$HOME/.pub-cache" -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i -E 's/compileSdkVersion[[:space:]]+flutter\.compileSdkVersion/compileSdkVersion 34/g' {} +
            find "$HOME/.pub-cache" -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*flutter\.compileSdkVersion/compileSdk = 34/g' {} +
            find "$HOME/.pub-cache" -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i -E 's/minSdkVersion[[:space:]]+flutter\.minSdkVersion/minSdkVersion 24/g' {} +
            find "$HOME/.pub-cache" -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -exec sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*flutter\.minSdkVersion/minSdk = 24/g' {} +
            
            # Force JVM target 17 in plugin gradle files
            find "$HOME/.pub-cache" -type f -name "*.gradle" -exec sed -i -E "s/jvmTarget = '1.8'/jvmTarget = '17'/g" {} +
            find "$HOME/.pub-cache" -type f -name "*.gradle" -exec sed -i -E 's/jvmTarget = "1.8"/jvmTarget = "17"/g' {} +
          fi

      # ----------------------------------------
      # FIX INVALID JAVA VERSION VALUES
      # ----------------------------------------
      - name: Fix invalid JavaVersion values
        shell: bash
        run: |
          find android -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -print0 | while IFS= read -r -d '' file
          do
            sed -i 's/VERSION_17_8/VERSION_17/g' "$file"
            sed -i 's/JavaVersion.VERSION_17_8/JavaVersion.VERSION_17/g' "$file"
          done

      # ----------------------------------------
      # ANALYZE
      # ----------------------------------------
      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      # ----------------------------------------
      # BUILD APK
      # ----------------------------------------
      - name: Build Release APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"

      # ----------------------------------------
      # UPLOAD APK
      # ----------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Siri-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
