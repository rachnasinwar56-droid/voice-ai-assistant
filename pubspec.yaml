name: siri_app
description: A Siri style AI voice assistant built with Flutter.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0" 
  
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_tts: ^4.2.1
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  android_intent_plus: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
